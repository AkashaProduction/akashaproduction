---
deployment:
  tasks:
    - export DEPLOYPATH=/home/prro3328/akashaproduction
    - export SRC=$(/bin/pwd)
    - /bin/mkdir -p $DEPLOYPATH $DEPLOYPATH/assets $DEPLOYPATH/assets/img $DEPLOYPATH/assets/img/projects $DEPLOYPATH/assets/img/source $DEPLOYPATH/assets/img/projects/source $DEPLOYPATH/assets/users-projects $DEPLOYPATH/assets/users-projects/images $DEPLOYPATH/includes $DEPLOYPATH/api $DEPLOYPATH/data
    - /bin/rm -f $DEPLOYPATH/solutions.php $DEPLOYPATH/contact.php $DEPLOYPATH/commander.php $DEPLOYPATH/mon-compte.php $DEPLOYPATH/mentions-legales.php $DEPLOYPATH/domain-check.php $DEPLOYPATH/checkout.php $DEPLOYPATH/commande-confirmee.php $DEPLOYPATH/presentation-code.html
    - /bin/rm -f $DEPLOYPATH/includes/i18n.php $DEPLOYPATH/includes/footer.php $DEPLOYPATH/includes/header.php $DEPLOYPATH/includes/domain-pricing.php $DEPLOYPATH/includes/stripe-config.php $DEPLOYPATH/includes/runtime-config.example.php
    - /bin/rm -rf $DEPLOYPATH/lang $DEPLOYPATH/messages $DEPLOYPATH/docs $DEPLOYPATH/storage
    - /bin/rm -f $DEPLOYPATH/assets/img/commander-growth.jpg $DEPLOYPATH/assets/img/commander-stars.jpg $DEPLOYPATH/assets/img/commander-victory.jpg
    - /bin/cp $SRC/.htaccess $DEPLOYPATH/.htaccess
    - /bin/cp $SRC/index.php $DEPLOYPATH/index.php
    - /bin/cp $SRC/admin.php $DEPLOYPATH/admin.php
    - /bin/cp $SRC/assets/site.css $DEPLOYPATH/assets/site.css
    - /bin/cp $SRC/assets/site.js $DEPLOYPATH/assets/site.js
    - /bin/cp -R $SRC/assets/img/. $DEPLOYPATH/assets/img/
    - /bin/cp -R $SRC/includes/. $DEPLOYPATH/includes/
    - /bin/cp -R $SRC/api/. $DEPLOYPATH/api/
    - /bin/cp -n $SRC/data/.htaccess $DEPLOYPATH/data/.htaccess 2>/dev/null || true
    - /bin/chmod 0775 $DEPLOYPATH/data $DEPLOYPATH/assets/users-projects/images 2>/dev/null || true
